name: Build Dairy Farm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. Checkout project
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      # 4. Verify Python version
      - name: Check Python
        run: |
          python --version
          python -m pip --version

      # 5. Install Buildozer dependencies
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3"
          python -m pip install buildozer
          python -m pip install kivy==2.3.1

      # 6. Create Buildozer spec
      - name: Create Buildozer spec
        run: |
          buildozer init

      # 7. Configure Buildozer
      - name: Configure Buildozer
        run: |
          sed -i 's/^title = .*/title = Dairy Farm/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = dairyfarm/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.dairyfarm/' buildozer.spec

          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,json,db,sqlite3/' buildozer.spec

          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1/' buildozer.spec

          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec

          sed -i 's/^fullscreen = .*/fullscreen = 0/' buildozer.spec

          sed -i 's/^android.api = .*/android.api = 36/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 24/' buildozer.spec

          sed -i 's/^android.archs = .*/android.archs = arm64-v8a/' buildozer.spec

          echo "----- buildozer.spec -----"
          cat buildozer.spec

      # 8. Build APK
      - name: Build APK
        run: |
          yes | buildozer -v android debug

      # 9. Find APK
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" \
            ! -path "*/.buildozer/*" \
            -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dairy-farm-apk
          path: |
            bin/*.apk
          if-no-files-found: error
